[workspace]
resolver = "2"
members = ["crates/gilune-kernel", "crates/gilune-ffi"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
rust-version = "1.98"

[workspace.dependencies]
rusqlite = { version = "0.31", features = ["bundled"] }
thiserror = "2"
tempfile = "3"

[profile.release]
lto = "thin"
