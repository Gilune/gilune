[workspace]
resolver = "2"
members = [
    "crates/gilune-document",
    "crates/gilune-kernel",
    "crates/gilune-sync",
    "crates/gilune-ffi",
    "crates/gilune-cli",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
rust-version = "1.98"

[workspace.dependencies]
fs4 = { version = "1.1", default-features = false }
hex = "0.4"
rusqlite = { version = "0.31", features = ["bundled"] }
serde_json = "1"
sha2 = "0.10"
tempfile = "3"
thiserror = "2"
uuid = { version = "1", features = ["v7"] }

[profile.release]
lto = "thin"
