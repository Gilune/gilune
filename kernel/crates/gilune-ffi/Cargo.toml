[package]
name = "gilune-ffi"
description = "The UniFFI boundary: narrow, versioned bindings over gilune-kernel. Bindings are generated per target from that target's own binary (07-compatibility)"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]
name = "gilune_ffi"

[[bin]]
name = "uniffi-bindgen"
path = "src/bin/uniffi-bindgen.rs"

[dependencies]
gilune-kernel = { path = "../gilune-kernel" }
gilune-sync = { path = "../gilune-sync" }
serde_json.workspace = true
thiserror.workspace = true
uniffi = { version = "0.29", features = ["cli"] }
whisper-rs = { version = "0.16", optional = true }

[dev-dependencies]
tempfile.workspace = true

[features]
# Local speech-to-text (desktop builds; the Android v0 profile captures
# and syncs to a coordinator instead, per the threat-model decision).
whisper = ["dep:whisper-rs"]
