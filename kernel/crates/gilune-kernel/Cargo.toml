[package]
name = "gilune-kernel"
description = "The portable Gilune kernel: storage, capture, events, operations — the invariant bearer (architecture/02-kernel-contract.md)"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[dependencies]
serde = { version = "1", features = ["derive"] }
gilune-document = { path = "../gilune-document" }
fs4.workspace = true
hex.workspace = true
rusqlite = { workspace = true, features = ["functions", "hooks"] }
serde_json.workspace = true
serde_yaml_ng = "=0.10.0"
sha2.workspace = true
thiserror.workspace = true
uuid.workspace = true

[dev-dependencies]
tempfile.workspace = true

[features]
# Opt-in timing diagnostics; normal builds contain no timers or logging.
index-profile = []
