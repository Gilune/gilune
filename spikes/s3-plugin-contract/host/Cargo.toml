[package]
name = "spike-s3-host"
version = "0.1.0"
edition = "2021"
publish = false
description = "Spike S3 host: runs the processor component under Wasmtime with capability checks and resource limits"

[dependencies]
anyhow = "1"
serde_json = "1"
wasmtime = "48"
wasmtime-wasi = "48"

[profile.dev]
debug = 1

[dev-dependencies]
hex = "0.4"
sha2 = "0.10"
