name: Windows build on Linux

# Reused by the release pipeline and the explicit MSI-only build. Compilation,
# packaging and MSI metadata checks all run on Linux. A Windows runner starts
# only when a manual dispatch asks for the installer lifecycle (billed at
# Windows rates; a few minutes), never from a push or a release.
on:
  workflow_call:
    inputs:
      version:
        required: true
        type: string
      validate_installer:
        required: false
        default: false
        type: boolean
      # Where the MSI installs. per-user (%LOCALAPPDATA%\Programs\Gilune, no
      # elevation, silent in-app updates) is the release shape from 1.2.2 on;
      # releases up to 1.2.1 were per-machine (Program Files, elevated, the
      # firewall rule added by the installer), and 1.2.0 onward carry the
      # updater that removes such a copy before installing per-user. The
      # per-machine shape stays only until no supported release needs it.
      scope:
        required: false
        default: 'per-user'
        type: string
  workflow_dispatch:
    inputs:
      version:
        description: 'MSI version: MAJOR.MINOR.PATCH, with MAJOR at least 1 (no release is published)'
        required: true
        default: '1.0.7'
        type: string
      validate_installer:
        description: 'Also install, repair, launch, upgrade and uninstall the MSI on a disposable Windows runner'
        required: false
        default: false
        type: boolean
      scope:
        description: 'Where the MSI installs: per-user (no elevation; the release shape) or per-machine (Program Files, elevated; releases up to 1.2.1)'
        required: false
        default: 'per-user'
        type: choice
        options: ['per-user', 'per-machine']

permissions:
  contents: read

concurrency:
  group: windows-cross-${{ github.event_name == 'workflow_dispatch' && github.run_id || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'push' && startsWith(github.ref, 'refs/heads/') }}

env:
  GILUNE_CI: '1'
  CARGO_TERM_COLOR: always
  GILUNE_RUST_VERSION: '1.98.0'

jobs:
  build:
    name: Compile and package Windows on Linux
    runs-on: ubuntu-24.04
    # A release tag starts with no cache of its own (caches are per ref, and
    # main never builds packages), so its first Windows build is cold: the
    # v1.1.1 tag run was cancelled at 35 minutes with the kernel built and the
    # application still packaging. Warm builds take about 5 minutes.
    timeout-minutes: 60
    env:
      VERSION: ${{ inputs.version }}
      LIBCLANG_PATH: /usr/lib/llvm-19/lib
      # Separate target roots avoid uploading/cleaning the cross tree twice.
      GILUNE_WINDOWS_BUILD_ROOT: ${{ github.workspace }}/app/build/windows-cross-target
    steps:
      - uses: actions/checkout@v4
      - name: Validate scripts and MSI version
        run: |
          python3 -B -m unittest discover -s .github/scripts -p 'test_*.py' -v
          python3 - <<'PY'
          import os, runpy
          runpy.run_path('.github/scripts/package-windows-linux.py')['version'](os.environ['VERSION'])
          PY
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: false
      - name: Linux compiler and installer tools
        run: |
          test -s /etc/apt/sources.list.d/ubuntu.sources
          apt_options=(-o Dir::Etc::sourcelist=/etc/apt/sources.list.d/ubuntu.sources
                       -o Dir::Etc::sourceparts=- -o APT::Update::Error-Mode=any)
          sudo apt-get "${apt_options[@]}" update
          sudo apt-get "${apt_options[@]}" install -y --no-install-recommends \
            clang-19 lld-19 llvm-19 libclang-19-dev cmake ninja-build \
            pkg-config libssl-dev wixl msitools python3-pefile unzip
          echo /usr/lib/llvm-19/bin >> "$GITHUB_PATH"
          rustup toolchain install "$GILUNE_RUST_VERSION" --profile minimal --no-self-update
          rustup default "$GILUNE_RUST_VERSION"
          rustup target add x86_64-pc-windows-msvc
      - name: Verify native versions in a real MSI
        run: python3 -B .github/scripts/test_windows_package.py --require-msi-tools -v
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cache/cargo-xwin
            ${{ runner.temp }}/gilune-windows-tools/downloads
          key: windows-cross-tools-v1-${{ hashFiles('.github/scripts/setup-windows-cross.sh', '.github/scripts/build-windows-linux.sh') }}
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            kernel -> target
            kernel -> ../app/build/windows-cross-target
          # rust-cache removes loose files inside target directories. Keep
          # the recipe stamp beside the target so warm restores retain it.
          cache-directories: ${{ env.GILUNE_WINDOWS_BUILD_ROOT }}.recipe.sha256
          key: windows-cross-llvm19-${{ hashFiles('.github/scripts/build-windows-linux.sh') }}
          cache-on-failure: true
      - name: Pinned cross compiler and Windows Java
        run: bash .github/scripts/setup-windows-cross.sh
      - name: Windows kernel and bindings
        run: bash .github/scripts/build-windows-linux.sh
      - name: Windows application
        working-directory: app
        run: |
          ./gradlew :composeApp:exportDesktopBundle \
            -Pgilune.desktop.target=windows-x64 \
            -Pgilune.desktop.bindings="$GITHUB_WORKSPACE/app/build/windows-cross/native/bindings" \
            "-Pgilune.version=$VERSION"
      - name: Assemble the Windows application and MSI
        env:
          SCOPE: ${{ inputs.scope || 'per-user' }}
        run: |
          python3 .github/scripts/package-windows-linux.py \
            --libs app/composeApp/build/export/desktop/lib \
            --native app/build/windows-cross/native --runtime "$WINDOWS_JRE_HOME" \
            --output app/build/windows-cross/package \
            --version "$VERSION" --commit "$GITHUB_SHA" --scope "$SCOPE"
      # No per-user release is published yet, so the lifecycle upgrades from
      # an older stamp of this very package.
      - name: Older-stamped per-user MSI for the upgrade check
        if: ${{ inputs.scope == 'per-user' && inputs.validate_installer }}
        run: |
          previous=$(python3 -c 'import sys; a,b,c=map(int,sys.argv[1].split(".")); print(f"{a}.{b}.{c-1}" if c else f"{a}.{b-1}.99" if b else f"{a-1}.99.99")' "$VERSION")
          # Packaging refuses an export whose version is not the MSI's, so the
          # application is exported again at the older stamp (the candidate's
          # MSI and manifest are already written).
          (cd app && ./gradlew :composeApp:exportDesktopBundle \
            -Pgilune.desktop.target=windows-x64 \
            -Pgilune.desktop.bindings="$GITHUB_WORKSPACE/app/build/windows-cross/native/bindings" \
            "-Pgilune.version=$previous")
          python3 .github/scripts/package-windows-linux.py \
            --libs app/composeApp/build/export/desktop/lib \
            --native app/build/windows-cross/native --runtime "$WINDOWS_JRE_HOME" \
            --output app/build/windows-cross/package-previous \
            --version "$previous" --commit "$GITHUB_SHA" --scope per-user
      - uses: actions/upload-artifact@v4
        if: ${{ inputs.scope == 'per-user' && inputs.validate_installer }}
        with:
          name: windows-previous-user-msi
          path: app/build/windows-cross/package-previous/*.msi
          if-no-files-found: error
          retention-days: 7
      - uses: actions/upload-artifact@v4
        with:
          name: gilune-windows-msi
          path: app/build/windows-cross/package/*.msi
          if-no-files-found: error
          retention-days: 7
      - uses: actions/upload-artifact@v4
        with:
          name: bindings-desktop-windows
          path: app/build/windows-cross/native/bindings
          if-no-files-found: error
          retention-days: 7
      # The payload manifest the installer lifecycle verifies against. Not a
      # gilune-* artifact, so the release job never collects it.
      - uses: actions/upload-artifact@v4
        with:
          name: windows-build-manifest
          path: app/build/windows-cross/package/Gilune/build-manifest.json
          if-no-files-found: error
          retention-days: 7

  installer:
    name: Installer lifecycle on a disposable Windows runner
    needs: build
    if: ${{ inputs.validate_installer }}
    runs-on: windows-2025
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: gilune-windows-msi
          path: artifacts/package
      - uses: actions/download-artifact@v4
        with:
          name: windows-build-manifest
          path: artifacts/package/Gilune
      - name: Previous published release to upgrade from
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release download v1.0.3 --pattern Gilune-1.0.3.msi --dir artifacts/previous
      - uses: actions/download-artifact@v4
        if: ${{ inputs.scope == 'per-user' }}
        with:
          name: windows-previous-user-msi
          path: artifacts/previous-user
      - name: Install, repair, launch, upgrade, refuse a downgrade, uninstall
        shell: pwsh
        run: .github/scripts/test-windows-installer.ps1 -Artifacts artifacts
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: windows-installer-results
          path: artifacts/results
          if-no-files-found: ignore
          retention-days: 7
